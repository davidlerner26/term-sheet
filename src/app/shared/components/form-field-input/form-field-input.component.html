<mat-form-field
  appearance="outline"
  [formGroup]="form"
  [ngClass]="{
    'full-width': size === 'full-width',
    'half-width': size === 'half-width',
  }"
>
  <mat-label>{{ label }}</mat-label>
  <input
    matInput
    [placeholder]="placeholder"
    [name]="name"
    [formControlName]="controlName"
    [type]="type"
  />
  <i class="material-icons mat-suffix" matSuffix>{{ suffix }}</i>
  <mat-error *ngIf="form.get(controlName)?.errors?.['required']"
    >{{ label }} is required</mat-error
  >
  <mat-error *ngIf="form.get(controlName)?.errors?.['email']"
    >{{ label }} is invalid</mat-error
  >
  <mat-error *ngIf="form.get(controlName)?.errors?.['minlength']"
    >{{ label }} must be
    {{ form.get(controlName)?.errors?.["minlength"]?.requiredLength }}
    long</mat-error
  >
</mat-form-field>
