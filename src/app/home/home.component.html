<form>
  <mat-form-field>
    <mat-label>Deal</mat-label>
    <input
      matInput
      placeholder="Search deals by name or price, please type at least 3 characters"
      [(ngModel)]="search"
      (ngModelChange)="onSearchChange($event)"
      name="search"
    />
    <mat-icon matSuffix>search</mat-icon>
  </mat-form-field>
</form>

<table mat-table [dataSource]="filteredDataSource" class="mat-elevation-z8">
  <ng-container matColumnDef="dealName">
    <th mat-header-cell *matHeaderCellDef>Deal Name</th>
    <td mat-cell *matCellDef="let element">{{ element.dealName }}</td>
  </ng-container>

  <ng-container matColumnDef="price">
    <th mat-header-cell *matHeaderCellDef>Purchase Price</th>
    <td mat-cell *matCellDef="let element">{{ element.price | currency }}</td>
  </ng-container>

  <ng-container matColumnDef="address">
    <th mat-header-cell *matHeaderCellDef>Address</th>
    <td mat-cell *matCellDef="let element">{{ element.address }}</td>
  </ng-container>

  <ng-container matColumnDef="noi">
    <th mat-header-cell *matHeaderCellDef>NOI (Net Operating Income)</th>
    <td mat-cell *matCellDef="let element">{{ element.noi | currency }}</td>
  </ng-container>

  <ng-container matColumnDef="capRate">
    <th mat-header-cell *matHeaderCellDef>Cap Rate</th>
    <td mat-cell *matCellDef="let element">{{ element.capRate }}%</td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
